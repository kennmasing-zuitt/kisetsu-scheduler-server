type Query {
    """
    Privileged actions, newest first. Admin only.
    """
    auditLogs(
        page: Int = 1

        """
        Max 100
        """
        limit: Int = 20
        action: AuditAction
        actorId: ID
        targetId: ID
    ): AuditLogPage!

    """
    All roles, system roles first. Requires readRoles.
    """
    roles: [Role!]!

    """
    One role by key. Requires readRoles.
    """
    role(key: String!): Role

    """
    Text messages, newest first (e.g. status: failed)
    """
    smsLogs(limit: Int! = 50, status: SmsStatus): [SmsLog!]!

    """
    A single booking, or null if it doesn't exist
    """
    booking(id: ID!): Booking

    """
    A client, or null if it doesn't exist
    """
    client(id: ID!): Client

    """
    The client with this mobile (any accepted format), or null when the number is new. VALIDATION_ERROR for numbers that are not valid mobiles.
    """
    clientByMobile(mobile: String!): Client

    """
    A single room, or null if it doesn't exist
    """
    room(id: ID!): Room

    """
    A single service, or null if it doesn't exist
    """
    service(id: ID!): Service

    """
    A single therapist, or null if it doesn't exist
    """
    therapist(id: ID!): Therapist

    """
    Bookings overlapping [from, to), earliest first (what a calendar view shows)
    """
    bookings(
        """
        Range start (inclusive)
        """
        from: DateTime!

        """
        Range end (exclusive). At most 62 days after `from`
        """
        to: DateTime!

        """
        Only this therapist's bookings
        """
        therapistId: ID

        """
        Only this room's bookings
        """
        roomId: ID
    ): [Booking!]!

    """
    A client's bookings, newest first
    """
    clientBookings(
        clientId: ID!

        """
        Max 100
        """
        limit: Int = 20
    ): [Booking!]!

    """
    Clients by name or mobile, with visit counts
    """
    clients(
        """
        Name words or 3+ digits of the mobile
        """
        search: String
        page: Int = 1

        """
        Max 100
        """
        limit: Int = 20
    ): ClientPage!

    """
    Promo codes, with how often each was used
    """
    promos(includeArchived: Boolean! = false): [Promo!]!

    """
    A promo by code (case doesn’t matter)
    """
    promo(code: String!): Promo

    """
    Every room, sorted by name
    """
    rooms: [Room!]!

    """
    Services sorted by name, with their prices
    """
    services(includeArchived: Boolean! = false): [Service!]!

    """
    The whole roster, sorted by name
    """
    therapists: [Therapist!]!

    """
    Upcoming bookings that would be cancelled if the therapist had these days off / leave dates (omitted lists keep the current ones). Ask before saving.
    """
    therapistConflicts(leaveDates: [String!], offDays: [Int!], id: ID!): [Booking!]!

    """
    A single example, or null if it doesn't exist
    """
    example(id: ID!): Example

    """
    Paginated list, newest first. (was GET /api/v1/example/readExample)
    """
    examples(
        page: Int = 1

        """
        Max 100
        """
        limit: Int = 20
    ): ExamplePage!

    """
    Paginated list of users, newest first. Requires readUsers. (was GET /api/v1/users)
    """
    users(
        page: Int = 1

        """
        Max 100
        """
        limit: Int = 20
    ): UserPage!

    """
    The signed-in user (requires a Bearer token)
    """
    me: User!

    """
    The current user, their effective permissions, and any impersonating admin
    """
    session: Session!

    """
    Daily, weekly, monthly or annual sales: services rendered per therapist and per service, each booking priced at the price that prevailed on its date, less its promo discount. Requires readReports.
    """
    salesReport(
        period: ReportPeriod!

        """
        The day, or any day in the wanted week / month / year, "YYYY-MM-DD"
        """
        date: String!

        """
        Also count bookings that have not ended yet (default: only rendered ones)
        """
        includeUpcoming: Boolean! = false
    ): SalesReport!

    """
    Liveness check that goes through the GraphQL pipeline
    """
    health: String!
}

type AuditLogPage {
    data: [AuditLog!]!
    page: Int!
    limit: Int!
    total: Int!
    totalPages: Int!
}

"""
A privileged action: who did what to whom, and why
"""
type AuditLog {
    id: ID!
    action: AuditAction!

    """
    The admin who performed the action
    """
    actorId: ID!

    """
    The affected user, if any
    """
    targetId: ID
    reason: String
    details: JSONObject
    requestId: String
    ip: String
    createdAt: DateTime!
}

enum AuditAction {
    impersonationStarted
    userLoggedOut
    userAccessChanged
    roleCreated
    roleUpdated
    roleDeleted
    twoFactorReset
}

"""
The `JSONObject` scalar type represents JSON objects as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSONObject
    @specifiedBy(url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf")

"""
ISO-8601 date-time string
"""
scalar DateTime

"""
A named set of permissions assigned to users
"""
type Role {
    id: ID!

    """
    Stable identifier, e.g. "support". Immutable.
    """
    key: String!
    name: String!
    description: String!
    kind: RoleKind!
    perms: [Permission!]!

    """
    System roles always exist and cannot be deleted
    """
    isSystem: Boolean!
    createdAt: DateTime!
    updatedAt: DateTime!
}

"""
admin roles may hold admin permissions; user roles may not
"""
enum RoleKind {
    admin
    user
}

"""
Granular permissions. Admin permissions (superAdmin, readUsers, manageUserAccess, readRoles, manageRoles, logoutUsers, impersonateUsers, readAuditLogs) only apply through an admin-kind role; superAdmin implies every permission.
"""
enum Permission {
    superAdmin
    readUsers
    manageUserAccess
    readRoles
    manageRoles
    logoutUsers
    impersonateUsers
    readAuditLogs
    resetTwoFactor
    createExample
    updateExample
    deleteExample
    createTherapist
    updateTherapist
    deleteTherapist
    createRoom
    updateRoom
    deleteRoom
    createBooking
    updateBooking
    deleteBooking
    createService
    updateService
    deleteService
    readReports
    readClients
    updateClient
    createPromo
    updatePromo
    deletePromo
    readSmsLogs
}

"""
An outgoing text message and its delivery result
"""
type SmsLog {
    id: ID!

    """
    E.164 mobile number
    """
    to: String!
    purpose: SmsPurpose!

    """
    The text, with any code masked
    """
    message: String!
    clientId: ID
    bookingId: ID
    status: SmsStatus!
    attempts: Int!
    provider: String!
    error: String
    sentAt: DateTime
    createdAt: DateTime!
}

enum SmsPurpose {
    setupCode
    rebook
}

enum SmsStatus {
    sending
    sent
    failed
}

"""
A client booking: one therapist, one room, one time range
"""
type Booking {
    id: ID!

    """
    The client's name (kept in sync with the Client record)
    """
    client: String!

    """
    Null only for bookings made before clients existed
    """
    clientId: ID

    """
    Canonical form, e.g. "+639171234567"
    """
    clientMobile: String

    """
    The client asked for this therapist by name
    """
    isRequested: Boolean!
    promoId: ID

    """
    The promo code applied, if any
    """
    promoCode: String
    therapistId: ID!
    roomId: ID!

    """
    The booked service; null only for bookings made before services existed
    """
    serviceId: ID
    start: DateTime!
    end: DateTime!
    status: BookingStatus!
    source: BookingSource!
    cancelledAt: DateTime
    cancelReason: CancelReason
    createdAt: DateTime!
    updatedAt: DateTime!
}

enum BookingStatus {
    booked
    cancelled
}

enum BookingSource {
    """
    Made in the scheduling app
    """
    staff

    """
    Made by the client on the booking site
    """
    client
}

enum CancelReason {
    staff
    therapistUnavailable
}

"""
A spa client, identified by mobile number
"""
type Client {
    id: ID!

    """
    Canonical form, e.g. "+639171234567"
    """
    mobile: String!
    firstName: String!
    lastName: String!
    fullName: String!
    notes: String!
    stats: ClientStats!

    """
    When the client set up app sign-in for the booking site; null if not set up
    """
    appEnabledAt: DateTime
    createdAt: DateTime!
    updatedAt: DateTime!
}

"""
Counted from bookings. A visit is a booking that has ended (service rendered).
"""
type ClientStats {
    visits: Int!

    """
    Bookings that have not ended yet
    """
    upcoming: Int!
    firstVisit: DateTime
    lastVisit: DateTime

    """
    Visits where the client asked for the therapist by name
    """
    requested: Int!

    """
    The therapist the client has seen most
    """
    favouriteTherapistId: ID
    favouriteTherapistName: String
}

"""
A treatment room; every booking takes one
"""
type Room {
    id: ID!
    name: String!

    """
    Hex color "#RRGGBB" for its bookings on the calendar
    """
    color: String!
    createdAt: DateTime!
    updatedAt: DateTime!
}

"""
A service clients book (Fuyu, Natsu, ...) and its prices
"""
type Service {
    id: ID!
    name: String!
    description: String!

    """
    False = archived: not offered for new bookings, still in reports
    """
    isActive: Boolean!

    """
    Full price history, current and past
    """
    prices: [ServicePrice!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

"""
One price rule. A booking takes the rule whose period contains its local date and whose days and length match it. Rules of a service never overlap.
"""
type ServicePrice {
    id: ID!

    """
    Minutes this price is for; null = any length
    """
    durationMin: Int

    """
    Weekdays it applies to (0 = Sunday); empty = every day
    """
    days: [Int!]!

    """
    Price in PHP
    """
    amount: Float!

    """
    First day of the period, "YYYY-MM-DD" (inclusive)
    """
    validFrom: String!

    """
    Last day of the period (inclusive); null = still the current price
    """
    validTo: String
}

"""
A therapist on the roster; one calendar column each
"""
type Therapist {
    id: ID!
    name: String!

    """
    Recurring weekly days off: 0 = Sunday … 6 = Saturday
    """
    offDays: [Int!]!

    """
    One-off leave, as local dates "YYYY-MM-DD"
    """
    leaveDates: [String!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type ClientPage {
    data: [Client!]!
    page: Int!
    limit: Int!
    total: Int!
    totalPages: Int!
}

"""
A promo code (one per booking). Its terms lock once a booking uses it; it can be archived or activated any time.
"""
type Promo {
    id: ID!
    code: String!
    description: String!
    discountType: DiscountType!

    """
    Percent or pesos, depending on discountType
    """
    value: Float!

    """
    First day it can be used, "YYYY-MM-DD"
    """
    validFrom: String!

    """
    Last day; null = no end
    """
    validTo: String

    """
    Services it applies to; empty = every service
    """
    serviceIds: [ID!]!
    isActive: Boolean!

    """
    Bookings that used it
    """
    timesUsed: Int!

    """
    Used at least once: code, discount and services are fixed
    """
    isLocked: Boolean!
    createdAt: DateTime!
    updatedAt: DateTime!
}

"""
percent = value % off the price; amount = value pesos off (capped at the price)
"""
enum DiscountType {
    percent
    amount
}

type Example {
    id: ID!
    firstName: String!
    lastName: String!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type ExamplePage {
    data: [Example!]!
    page: Int!
    limit: Int!
    total: Int!
    totalPages: Int!
}

type UserPage {
    data: [User!]!
    page: Int!
    limit: Int!
    total: Int!
    totalPages: Int!
}

"""
A user account
"""
type User {
    id: ID!
    name: String!
    email: String!

    """
    The user's role and its permissions
    """
    role: Role!

    """
    Per-user grants on top of the role
    """
    extraPerms: [Permission!]!
    createdAt: DateTime!
    updatedAt: DateTime!

    """
    Signs in with an authenticator code too
    """
    twoFactorEnabled: Boolean!
    twoFactorEnabledAt: DateTime
}

"""
Who the current token belongs to and what it can do
"""
type Session {
    user: User!

    """
    Permissions that actually apply (all of them for a super admin)
    """
    effectivePerms: [Permission!]!

    """
    Set when an admin is impersonating this user: show a banner in the UI
    """
    impersonatedBy: User

    """
    The user's role requires two-factor sign-in
    """
    twoFactorRequired: Boolean!
}

type SalesReport {
    period: ReportPeriod!

    """
    First day, "YYYY-MM-DD"
    """
    from: String!

    """
    Last day, "YYYY-MM-DD" (inclusive)
    """
    to: String!
    timeZone: String!

    """
    Currency of every amount, e.g. "PHP"
    """
    currency: String!
    includeUpcoming: Boolean!
    generatedAt: DateTime!
    totals: SalesTotals!

    """
    Roster order; removed therapists last
    """
    therapists: [TherapistSales!]!
    services: [ServiceSales!]!
    series: [SalesBucket!]!
    unpriced: [UnpricedBooking!]!

    """
    Most used first
    """
    promos: [PromoSales!]!
    clients: ClientSummary!
    cancellations: CancellationSummary!
}

"""
daily (charted per hour); weekly = Monday to Sunday; monthly; annual. Dates in SCHEDULE_TIMEZONE
"""
enum ReportPeriod {
    daily
    weekly
    monthly
    annual
}

type SalesTotals {
    """
    Services rendered (bookings)
    """
    bookings: Int!
    minutes: Int!

    """
    At the prevailing prices
    """
    grossRevenue: Float!

    """
    Promo discounts
    """
    discounts: Float!

    """
    Net: grossRevenue − discounts (what was charged)
    """
    revenue: Float!
    unpriced: Int!

    """
    Bookings where the client asked for the therapist by name
    """
    requested: Int!

    """
    Bookings the client made on the booking site
    """
    online: Int!
}

type TherapistSales {
    therapistId: ID!
    therapistName: String!
    bookings: Int!
    minutes: Int!

    """
    At the prevailing prices
    """
    grossRevenue: Float!

    """
    Promo discounts
    """
    discounts: Float!

    """
    Net: grossRevenue − discounts
    """
    revenue: Float!

    """
    Bookings that added no revenue (see SalesReport.unpriced)
    """
    unpriced: Int!

    """
    Bookings where the client asked for this therapist by name
    """
    requested: Int!

    """
    requested / bookings, 0–1
    """
    requestRate: Float!

    """
    Only services with at least one booking
    """
    services: [ServiceCount!]!
    lines: [SalesLine!]!
}

"""
How many times a therapist rendered a service
"""
type ServiceCount {
    serviceId: ID!
    serviceName: String!
    bookings: Int!
    revenue: Float!
}

"""
Bookings of one service, at one length and one price
"""
type SalesLine {
    serviceId: ID!
    serviceName: String!
    durationMin: Int!

    """
    The price that prevailed on those bookings’ dates
    """
    unitPrice: Float!
    bookings: Int!

    """
    unitPrice × bookings
    """
    grossRevenue: Float!

    """
    Promo discounts
    """
    discounts: Float!

    """
    Net: grossRevenue − discounts
    """
    revenue: Float!
}

type ServiceSales {
    serviceId: ID!
    serviceName: String!
    isActive: Boolean!
    bookings: Int!
    minutes: Int!
    grossRevenue: Float!
    discounts: Float!

    """
    Net: grossRevenue − discounts
    """
    revenue: Float!
    unpriced: Int!
    lines: [SalesLine!]!
}

"""
One hour (daily), day (weekly/monthly) or month (annual) of the chart
"""
type SalesBucket {
    """
    "YYYY-MM-DDTHH" (daily), "YYYY-MM-DD" (weekly, monthly) or "YYYY-MM" (annual)
    """
    key: String!
    bookings: Int!
    revenue: Float!
}

type UnpricedBooking {
    bookingId: ID!
    client: String!
    start: DateTime!
    durationMin: Int!
    therapistName: String!
    serviceName: String
    reason: UnpricedReason!
}

"""
noService = booking has no service; noPrice = no price rule for its date/length
"""
enum UnpricedReason {
    noService
    noPrice
}

"""
A promo code used in the period
"""
type PromoSales {
    promoId: ID!
    code: String!
    bookings: Int!

    """
    Total discount given
    """
    discounts: Float!
}

type ClientSummary {
    """
    Different clients (by mobile) in the period
    """
    uniqueClients: Int!

    """
    Whose first booking ever is in the period
    """
    newClients: Int!

    """
    Who had booked before the period
    """
    returningClients: Int!

    """
    Bookings without a client (made before clients existed)
    """
    noClient: Int!

    """
    Most bookings in the period first (up to 10)
    """
    top: [TopClient!]!
}

type TopClient {
    clientId: ID!
    name: String!
    mobile: String!

    """
    Bookings in the period
    """
    bookings: Int!

    """
    Net revenue in the period
    """
    revenue: Float!

    """
    Visits ever (ended bookings)
    """
    totalVisits: Int!
}

"""
Bookings due in the period that were cancelled
"""
type CancellationSummary {
    total: Int!

    """
    Cancelled by staff
    """
    byStaff: Int!

    """
    Therapist became unavailable; the client was texted to rebook
    """
    therapistUnavailable: Int!
}

type Mutation {
    """
    Requires manageRoles. You can only include permissions you hold; admin roles need a super admin. Audited.
    """
    createRole(input: CreateRoleInput!): Role!

    """
    Requires manageRoles. System roles and roles still assigned to users (ROLE_IN_USE) cannot be deleted. Audited.
    """
    deleteRole(key: String!): Boolean!

    """
    Requires manageRoles. Changes apply to every user with the role on their next request. The super-admin role is locked. Audited.
    """
    updateRole(input: UpdateRoleInput!, key: String!): Role!

    """
    Books a therapist and a room. Errors: VALIDATION_ERROR (times, opening hours), NOT_FOUND (therapist/room), THERAPIST_UNAVAILABLE, THERAPIST_DOUBLE_BOOKED, ROOM_TAKEN
    """
    createBooking(input: CreateBookingInput!): Booking!

    """
    Errors: VALIDATION_ERROR, PROMO_CODE_TAKEN
    """
    createPromo(input: CreatePromoInput!): Promo!
    createRoom(input: CreateRoomInput!): Room!

    """
    Adds a service with its price list. Errors: VALIDATION_ERROR, SERVICE_NAME_TAKEN
    """
    createService(input: CreateServiceInput!): Service!

    """
    Adds a therapist to the roster
    """
    createTherapist(input: CreateTherapistInput!): Therapist!

    """
    Cancels a booking: it is kept (status cancelled) but frees the therapist and room. With notifyClient the client gets a text. NOT_FOUND, or BOOKING_CANCELLED if it already was.
    """
    deleteBooking(notifyClient: Boolean! = false, id: ID!): Boolean!

    """
    Deletes a promo no booking used. Errors: NOT_FOUND, PROMO_IN_USE (archive it)
    """
    deletePromo(id: ID!): Boolean!

    """
    Returns true when deleted. Errors: NOT_FOUND, ROOM_HAS_BOOKINGS (the room still has upcoming bookings)
    """
    deleteRoom(id: ID!): Boolean!

    """
    Deletes a service no booking uses. Errors: NOT_FOUND, SERVICE_IN_USE (archive it instead)
    """
    deleteService(id: ID!): Boolean!

    """
    Returns true when deleted. Errors: NOT_FOUND, THERAPIST_HAS_BOOKINGS (the therapist still has upcoming bookings)
    """
    deleteTherapist(id: ID!): Boolean!

    """
    Lost phone: turns off the client's app sign-in for the booking site and ends their sessions. They set it up again on the booking site (SMS code, then QR).
    """
    resetClientApp(id: ID!): Client!

    """
    Edit, move or reassign a booking. Same errors as createBooking
    """
    updateBooking(input: UpdateBookingInput!, id: ID!): Booking!

    """
    Rename a client or change their mobile / notes. Errors: CLIENT_MOBILE_TAKEN
    """
    updateClient(input: UpdateClientInput!, id: ID!): Client!

    """
    Archive / activate (isActive), edit description or period any time. Code, discount and services lock once used (PROMO_LOCKED).
    """
    updatePromo(input: UpdatePromoInput!, id: ID!): Promo!
    updateRoom(input: UpdateRoomInput!, id: ID!): Room!

    """
    Rename, archive (isActive: false) or replace the price list. Reports are priced from the list as it is when they run, so editing an old period corrects past reports.
    """
    updateService(input: UpdateServiceInput!, id: ID!): Service!

    """
    Rename a therapist or replace their weekly days off / leave dates. Upcoming bookings on days they no longer work are cancelled and the clients are texted to rebook (preview them with therapistConflicts).
    """
    updateTherapist(input: UpdateTherapistInput!, id: ID!): Therapist!

    """
    (was POST /api/v1/example/createExample)
    """
    createExample(input: CreateExampleInput!): Example!

    """
    Returns true when deleted; NOT_FOUND error otherwise. (was POST /api/v1/example/deleteExample)
    """
    deleteExample(id: ID!): Boolean!

    """
    (was POST /api/v1/example/updateExample)
    """
    updateExample(input: UpdateExampleInput!, id: ID!): Example!

    """
    Assign a user's role and per-user extra permissions. You can only grant permissions you hold, only a super admin can manage admins, and nobody can change their own access. Audited.
    """
    setUserAccess(input: SetUserAccessInput!, userId: ID!): User!

    """
    Requires the current password (403 WRONG_PASSWORD otherwise). Signs out every other device and returns a fresh token for this one.
    """
    changePassword(input: ChangePasswordInput!): AuthPayload!

    """
    Requires impersonateUsers. Returns a short-lived token that acts as a non-admin user, for support and debugging. A reason is required and recorded in the audit log.
    """
    impersonateUser(
        """
        Why: stored in the audit log (5-500 chars)
        """
        reason: String!
        userId: ID!
    ): ImpersonationPayload!

    """
    Exchange email + password for an access token, or for a challengeToken when two-factor sign-in is on (or required but not set up). Unknown email and wrong password both return INVALID_CREDENTIALS (401). Rate limited per IP.
    """
    login(input: LoginInput!): LoginPayload!

    """
    Revokes every token for this user on every device (increments tokenVersion). Returns true; the client should delete its stored token.
    """
    logout: Boolean!

    """
    Requires logoutUsers. Signs one user out of every device (increments their tokenVersion). Returns true; NOT_FOUND if the user does not exist. Audited.
    """
    logoutUser(userId: ID!): Boolean!

    """
    Create an account and sign in. Rate limited per IP. (was POST /api/v1/auth/register)
    """
    register(input: RegisterInput!): RegisterPayload!

    """
    Step 2 of login: the 6-digit authenticator code, or a recovery code. INVALID_TWO_FACTOR_CODE (401); 5 wrong codes lock 2FA for 15 minutes (TWO_FACTOR_LOCKED).
    """
    loginTwoFactor(code: String!, challengeToken: String!): AuthPayload!

    """
    Starts turning 2FA on and returns the QR code. Signed in, or with the challengeToken from a login that returned twoFactorSetupRequired.
    """
    setupTwoFactor(challengeToken: String): TwoFactorSetup!

    """
    Finishes turning 2FA on with the first code from the app. Returns the recovery codes (shown once) and an access token.
    """
    confirmTwoFactor(challengeToken: String, code: String!): TwoFactorEnabledPayload!

    """
    Turns 2FA off (password + code). TWO_FACTOR_REQUIRED (403) for roles that require it.
    """
    disableTwoFactor(code: String!, password: String!): Boolean!

    """
    New recovery codes (the old ones stop working)
    """
    regenerateRecoveryCodes(code: String!): [String!]!

    """
    Lost phone: turns a user's 2FA off and signs them out everywhere. Only a super admin can reset an admin. Audited.
    """
    resetUserTwoFactor(userId: ID!): Boolean!
}

input CreateRoleInput {
    """
    2-40 lowercase letters, digits or dashes
    """
    key: String!
    name: String!
    description: String
    kind: RoleKind!
    perms: [Permission!]!
}

