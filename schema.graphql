input SetUserAccessInput {
    """
    Role key, e.g. "user" or "support"
    """
    role: String!

    """
    Per-user extras on top of the role. Replaces the existing list.
    """
    extraPerms: [Permission!] = []
}

"""
Send the token as `Authorization: Bearer <token>` on later requests
"""
type AuthPayload {
    """
    JWT access token (HS256), expires after JWT_EXPIRES_IN
    """
    token: String!
    user: User!
}

input ChangePasswordInput {
    currentPassword: String!

    """
    8-72 characters, different from the current one
    """
    newPassword: String!
}

"""
A short-lived token that acts as `user`. Send it as `Authorization: Bearer <token>`.
"""
type ImpersonationPayload {
    token: String!
    expiresAt: DateTime!

    """
    The impersonated user
    """
    user: User!

    """
    The admin who started the session
    """
    impersonatedBy: ID!
}

"""
Either a session (`token` + `user`), or the next step: `twoFactorRequired` -> `loginTwoFactor(challengeToken, code)`; `twoFactorSetupRequired` -> `setupTwoFactor(challengeToken)` then `confirmTwoFactor(challengeToken, code)`.
"""
type LoginPayload {
    """
    Set when signed in
    """
    token: String

    """
    Set when signed in
    """
    user: User
    twoFactorRequired: Boolean!

    """
    The role requires 2FA and it is not set up yet
    """
    twoFactorSetupRequired: Boolean!

    """
    Short-lived token for the next step (5 min for the code, 15 min for setup)
    """
    challengeToken: String
}

input LoginInput {
    email: String!
    password: String!
}

type RegisterPayload {
    """
    JWT access token (HS256), expires after JWT_EXPIRES_IN
    """
    token: String!
    user: User!
    message: String!
}

input RegisterInput {
    name: String!

    """
    Normalised to lowercase
    """
    email: String!

    """
    8-72 characters
    """
    password: String!
}

"""
Scan `qrDataUrl` (or type `secret`) in an authenticator app
"""
type TwoFactorSetup {
    """
    Base32 secret, for typing in by hand
    """
    secret: String!

    """
    otpauth:// link
    """
    otpauthUrl: String!

    """
    QR code as a PNG data URL
    """
    qrDataUrl: String!
}

type TwoFactorEnabledPayload {
    """
    JWT access token (HS256), expires after JWT_EXPIRES_IN
    """
    token: String!
    user: User!

    """
    One-time recovery codes. Shown only now.
    """
    recoveryCodes: [String!]!
}
