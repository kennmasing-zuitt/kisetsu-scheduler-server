# scheduling-api.kisetsuspa.com -> kisetsu-scheduler-server container
#
# Server block for the shared Dockerized Nginx proxy. Copy it into the proxy's
# conf.d/ folder as scheduling-api.conf (next to scheduling.conf, authapp.conf, ...).
# Port 80 / HTTP->HTTPS is handled by the proxy's shared 00-http.conf.

server {
    listen 443 ssl;
    http2 on;
    server_name scheduling-api.kisetsuspa.com;

    # Certificate covering kisetsuspa.com, www., scheduling. and scheduling-api. (see
    # kisetsu-booking-client/deploy/README.md for the certbot command)
    ssl_certificate     /etc/letsencrypt/live/kisetsuspa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kisetsuspa/privkey.pem;

    # Docker's DNS: Nginx still starts even if this app is stopped
    resolver 127.0.0.11 valid=10s;
    # Network alias from docker-compose.yaml, reached over the shared "web" network
    set $scheduling_api http://kisetsu-scheduler-server:2200;

    # GraphQL requests are small JSON bodies
    client_max_body_size 1m;

    # Shared by the locations below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Staff API (CORS is answered by the app, using CORS_ORIGINS)
    location /graphql {
        proxy_pass $scheduling_api;
    }

    # Public booking API for kisetsuspa.com/book (CORS: BOOKING_CORS_ORIGINS)
    location /booking/graphql {
        proxy_pass $scheduling_api;
    }

    # Liveness probe
    location = /health {
        proxy_pass $scheduling_api;
    }

    # Nothing else is served
    location / {
        return 404;
    }
}
