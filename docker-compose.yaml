services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: kisetsu-scheduler-server:latest
        container_name: kisetsu-scheduler-server
        restart: unless-stopped
        # Secrets and settings (JWT_SECRET, AUTH_RATE_LIMIT_MAX, SCHEDULE_TIMEZONE, ...) are read
        # from the .env next to this file. The values under "environment" win over it, so the
        # same .env works for `npm run dev` and for Docker.
        env_file: .env
        environment:
            NODE_ENV: production
            PORT: 2200
            # The bundled MongoDB below; set DOCKER_MONGO_URI in .env to use another one (e.g. Atlas)
            MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/kisetsu-scheduler}
            # Browser origins allowed to call the API (the client's public URL)
            CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-https://scheduling.masings.com}
            # One proxy (Nginx) in front: trust its X-Forwarded-For so rate limits see real IPs
            TRUST_PROXY: 1
        depends_on:
            mongo:
                condition: service_healthy
        # no "ports:" - the Nginx container reaches it over the web network
        networks:
            default:
            web:
                # Unique name on the shared network. Every project's service is called "app",
                # so the proxy must use this alias (see nginx.conf), not "app".
                aliases: [kisetsu-scheduler-server]

    mongo:
        image: mongo:8
        container_name: kisetsu-scheduler-mongo
        restart: unless-stopped
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        # Only on this project's private network: not reachable from the proxy or the internet
        networks:
            default:

volumes:
    mongo-data:

networks:
    web:
        external: true # shared with the Nginx proxy
